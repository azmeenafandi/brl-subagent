name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes the previous run (no dead-weight runs holding queue slots).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # A hung vitest run must not burn to GitHub's 6-hour ceiling (sdk-contract flake class).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      # Import convention (issue #476): only a statement-level `import type` may be hoisted and
      # sorted (every loader erases it); type names fold into the value statement as inline `type`
      # modifiers AT ITS POSITION; value statements never move and never merge with each other.
      # Style is enforced without touching module-request order — see the guard's header.
      - run: node scripts/check-imports.mjs
      # The README's "<N>+ test suite" claim is pinned to reality (docs-pinning class, issue #166).
      # Two invariants, two seams: TRUTH (the claim must never overstate the suite) is a property of
      # the branch, so every PR and push checks it. FRESHNESS (the claim may trail the real count by
      # at most 100) is a property of the *merged tree* — a task PR based on `dev` cannot satisfy it,
      # and that merge-ref race cost #459 a cycle. So the default arm is deliberately lenient, and the
      # release seam is the enforcement point: the release PR (base `main`) and the push that lands
      # it. Bump the claim there with `scripts/check-readme-test-count.mjs <report> --bump`
      # (release ritual, step 5). `GITHUB_BASE_REF` is empty on `push`, hence the explicit ref arm.
      - run: npx vitest run --reporter=default --reporter=json --outputFile=vitest-report.json
      - name: README count — truth (every branch)
        if: ${{ !(github.event_name == 'pull_request' && github.base_ref == 'main') && !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        run: node scripts/check-readme-test-count.mjs vitest-report.json
      - name: README count — truth + freshness (release seam only)
        if: ${{ (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        run: node scripts/check-readme-test-count.mjs vitest-report.json --strict
      # The suite's growth budget (issues #368, #490): wall time <= 60 s, and a test:source LOC
      # ratio PER SURFACE — src <= 2.0 (warning band at 1.95) and scripts <= 1.0 — plus a floor
      # check: every top-level scripts/*.mjs must be imported by a test. Ceilings, not targets.
      - run: node scripts/check-test-budget.mjs vitest-report.json
      # The tracked instruction surface (#513): a durable artifact — a bank, a findings file, a report —
      # may not be placed in a system temp directory, because the resume it exists for is exactly the
      # case where the machine went down. Probe scratch ("scratch repos in /tmp") and a description of
      # the #512 refusal are printed as non-hits, not failed. The gitignored .pi/brl-subagent overrides
      # are a separate, warn-only scan and are deliberately NOT gated here: they are not in the repo.
      - run: node scripts/audit-scratch-instructions.mjs
      # The Jev ritual's mechanical gate (issue #366): the dispatch-line formatter's selftest, then
      # an audit of the calibration log — every row since the strict-Jev cutoff (2026-10-12) must
      # carry a queried confidence or an explicit gap marker. A bare level is a finding.
      - run: node .pi/skills/worktree/jev-check.mjs --selftest
      - run: node .pi/skills/worktree/jev-check.mjs --ledger .development/investigations/jev-calibration-log.md
      # Permanent guard for the sprint-metrics window parser (issue #336): a
      # time-suffixed bound must not silently drop its day (pre-fix: 22 vs 68).
      - run: python3 .pi/skills/worktree/sprint-metrics.py --selftest
      # The `run` helper (issue #504): a command's exit status must survive its filter. Two
      # `cmd | tail` / `cmd | grep` measurements, then `echo $?`, certified four FAILING review
      # records as exit 0 (U1) and reported 0 for a tool that exited 1 (U4) — the status read
      # was the filter's. This runs the whole table: command status vs filter status, a vacuous
      # filter (loud by default, authoritative under --require-filter), a broken filter, SIGPIPE
      # (141), --stderr routing, literal argv, the 64/127 overlap — plus both incidences as
      # named cases with the pre-helper control beside the fix.
      - run: bash .pi/skills/worktree/run.sh --selftest
